<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 320px; padding: 15px; margin: 0; color: #333; display: flex; flex-direction: column; }
    #info-grid { display: grid; grid-template-columns: 70px 1fr; gap: 5px 10px; font-size: 13px; margin: 15px 0; }
    #info-grid strong { font-weight: 600; color: #555; }
    button { width: 100%; padding: 10px; font-size: 14px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; transition: background-color 0.2s; }
    button:hover:not(:disabled) { background-color: #0056b3; }
    button:disabled { background-color: #aaa; cursor: not-allowed; }
    form { margin-top: 18px; display: grid; gap: 8px; }
    label { font-size: 13px; display: grid; gap: 4px; }
    input { font: inherit; padding: 6px; min-width: 0; }
    dialog { max-width: 280px; border: 1px solid #b33; border-radius: 6px; }
    dialog p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
  </style>
</head>
<body>
  <div id="info-grid">
    <strong>国家:</strong> <span id="country">加载中...</span>
    <strong>IP:</strong> <span id="ip">加载中...</span>
    <strong>来源:</strong> <span id="source" style="overflow-wrap:anywhere">加载中...</span>
    <strong>纬度:</strong> <span id="latitude">加载中...</span>
    <strong>经度:</strong> <span id="longitude">加载中...</span>
    <strong>更新于:</strong> <span id="updateTime">加载中...</span>
  </div>
  <p id="status" role="status" style="font-size:13px;overflow-wrap:anywhere"></p>
  <button id="refresh-btn">立即刷新</button>
  <form id="manual-form" novalidate>
    <label>纬度（-90 到 90）<input id="manual-latitude" type="number" min="-90" max="90" step="any" required></label>
    <label>经度（-180 到 180）<input id="manual-longitude" type="number" min="-180" max="180" step="any" required></label>
    <button type="submit">保存并使用手动经纬度</button>
    <button type="button" id="automatic-btn">恢复 IP 自动定位</button>
    <small>手动设置保存在本地，持续生效直到恢复自动定位。</small>
  </form>
  <dialog id="failure-dialog" aria-labelledby="failure-title">
    <h3 id="failure-title">定位操作失败</h3>
    <p id="failure-message"></p>
    <button id="dismiss-failure">知道了，查看或设置经纬度</button>
  </dialog>
  <script src="popup.js"></script>
</body>
</html>
